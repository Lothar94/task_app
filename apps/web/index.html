<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Applies the saved theme before first paint. Keep the key and rule in sync with
      // src/features/theme/theme.ts (THEME_STORAGE_KEY, resolveInitialTheme).
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('fleet.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%238083ff'/%3E%3C/svg%3E"
    />
    <title>Agent Fleet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
